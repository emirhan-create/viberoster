<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23111113%22/><text x=%2250%22 y=%2265%22 font-family=%22system-ui,-apple-system,sans-serif%22 font-weight=%22800%22 font-size=%2248%22 fill=%22%23FFFFFF%22 text-anchor=%22middle%22>VR</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeRoster — Curated Agent Roster for Claude & Cursor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('viberoster_theme_mode') || localStorage.getItem('viberules_theme_mode') || localStorage.getItem('vibehub_theme_mode');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#09090B] text-[#111113] dark:text-[#F4F4F5] min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
